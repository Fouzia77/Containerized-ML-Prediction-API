name: ML API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: pytest -q tests/
      - name: Build Docker image
        run: docker build -t ml-api:${{ github.sha }} .
      - name: Simulate registry push
        if: success()
        run: echo "Tests and Docker build succeeded; registry push is simulated for this assignment."
